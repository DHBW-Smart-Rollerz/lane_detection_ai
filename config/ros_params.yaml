# This file contains example node parameters.
lane_detection_ai_node:
  ros__parameters:
    # Path of the model config
    model_config_path: "config/model_onnx_bev_config.py"

    # Topics for an example publisher and subscriber
    image_subscriber: "/camera/image/bev"
    result_publisher: "/lane_detection/lane"
    new_image_publisher: "/lane_detection/new_image"
    debug_image_publisher: "/lane_detection/debug/image"
    state: 1 # 0: Inactive, 1: Active
